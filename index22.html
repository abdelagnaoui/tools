<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Open Links</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #e7f0ff;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
}


/* =====================================================
   CONTROL PANEL
===================================================== */

.control-panel {
    width: 500px;
    max-width: calc(100% - 30px);

    margin: 25px auto 22px auto;

    padding: 20px 16px 16px 16px;

    background: #ffffff;

    border-radius: 8px;

    box-shadow:
        0 3px 14px rgba(0,0,0,0.12);
}


.control-panel h2 {
    margin: 8px 0 16px 0;

    text-align: center;

    font-size: 20px;

    color: #16458b;
}


/* =====================================================
   TEXTAREA
===================================================== */

#links {
    width: 100%;

    height: 130px;

    resize: vertical;

    padding: 10px;

    border: 1px solid #c7d1dc;

    border-radius: 5px;

    outline: none;

    font-family: monospace;

    font-size: 13px;

    color: #111;

    background: #ffffff;
}


#links:focus {
    border-color: #1683ff;

    box-shadow:
        0 0 0 2px rgba(22,131,255,0.12);
}


/* =====================================================
   OPTIONS
===================================================== */

.options {
    margin-top: 10px;

    text-align: left;

    font-size: 13px;
}


.options label {
    display: block;

    margin: 5px 0;

    cursor: pointer;
}


.options input {
    margin-right: 5px;

    cursor: pointer;
}


/* =====================================================
   BUTTONS
===================================================== */

.main-button {
    width: 100%;

    height: 31px;

    margin-top: 8px;

    border: none;

    border-radius: 4px;

    background: #087df5;

    color: #ffffff;

    font-size: 14px;

    cursor: pointer;
}


.main-button:hover {
    background: #006fe6;
}


.clear-button {
    width: 100%;

    height: 31px;

    margin-top: 8px;

    border: none;

    border-radius: 4px;

    background: #087df5;

    color: #ffffff;

    font-size: 14px;

    cursor: pointer;
}


.clear-button:hover {
    background: #006fe6;
}


/* =====================================================
   LINKS GRID
===================================================== */

#linksContainer {

    width: 100%;

    padding: 0 15px 30px 15px;

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(320px, 1fr));

    gap: 12px;
}


/* =====================================================
   LINK BOX
===================================================== */

.link-box {

    height: 195px;

    background: #ffffff;

    border: 1px solid #ff3030;

    border-radius: 5px;

    overflow: hidden;

    position: relative;
}


/* =====================================================
   HEADER
===================================================== */

.link-header {

    height: 62px;

    padding: 0 12px;

    background: #1d1d1d;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;
}


.link-title {

    flex: 1;

    min-width: 0;

    color: #ff4141;

    font-family: cursive;

    font-size: 17px;

    font-weight: bold;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.link-menu {

    color: #ffffff;

    font-size: 17px;

    flex-shrink: 0;
}


/* =====================================================
   IFRAME
===================================================== */

.link-frame {

    display: block;

    width: 100%;

    height: calc(100% - 62px);

    border: 0;

    background: #ffffff;
}


/* =====================================================
   LOADING
===================================================== */

.loading {

    position: absolute;

    top: 62px;

    left: 0;

    right: 0;

    bottom: 0;

    background: #ffffff;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #777;

    font-size: 13px;

    z-index: 2;
}


.loading.hidden {
    display: none;
}


/* =====================================================
   FALLBACK
===================================================== */

.frame-fallback {

    position: absolute;

    top: 62px;

    left: 0;

    right: 0;

    bottom: 0;

    background: #ffffff;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    gap: 10px;

    padding: 15px;

    text-align: center;

    z-index: 3;
}


.frame-fallback.show {
    display: flex;
}


.frame-fallback-title {
    color: #e53935;

    font-size: 14px;

    font-weight: bold;
}


.frame-fallback-text {
    color: #777;

    font-size: 11px;

    line-height: 16px;
}


.open-new-tab {

    padding: 7px 14px;

    border: none;

    border-radius: 4px;

    background: #087df5;

    color: #ffffff;

    text-decoration: none;

    font-size: 12px;

    cursor: pointer;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    #linksContainer {
        grid-template-columns: 1fr;

        padding-left: 10px;
        padding-right: 10px;
    }

    .control-panel {
        width: calc(100% - 20px);
    }

}


</style>

</head>


<body>


<!-- =====================================================
     CONTROL PANEL
===================================================== -->

<div class="control-panel">

    <h2>
        Enter Links and Select Prefix Type:
    </h2>


    <textarea
        id="links"
        placeholder="example.com/page1
example.com/page2
https://example.com/page3"
    ></textarea>


    <div class="options">

        <label>
            <input
                type="checkbox"
                id="httpsPrefix"
                checked
            >
            Add https://
        </label>


        <label>
            <input
                type="checkbox"
                id="httpPrefix"
            >
            Add http://
        </label>


        <label>
            <input
                type="checkbox"
                id="noPrefix"
            >
            Neither
        </label>

    </div>


    <button
        class="main-button"
        id="openBtn"
    >
        Open Inside Page
    </button>


    <button
        class="clear-button"
        id="clearBtn"
    >
        Clear
    </button>

</div>



<!-- =====================================================
     LINKS
===================================================== -->

<div id="linksContainer"></div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const linksInput =
    document.getElementById("links");

const linksContainer =
    document.getElementById("linksContainer");

const openBtn =
    document.getElementById("openBtn");

const clearBtn =
    document.getElementById("clearBtn");

const httpsPrefix =
    document.getElementById("httpsPrefix");

const httpPrefix =
    document.getElementById("httpPrefix");

const noPrefix =
    document.getElementById("noPrefix");


/* =====================================================
   PREFIX CHECKBOXES
===================================================== */

httpsPrefix.addEventListener("change", function () {

    if (this.checked) {

        httpPrefix.checked = false;

        noPrefix.checked = false;
    }

});


httpPrefix.addEventListener("change", function () {

    if (this.checked) {

        httpsPrefix.checked = false;

        noPrefix.checked = false;
    }

});


noPrefix.addEventListener("change", function () {

    if (this.checked) {

        httpsPrefix.checked = false;

        httpPrefix.checked = false;
    }

});


/* =====================================================
   PREPARE URL
===================================================== */

function prepareUrl(rawUrl) {

    let url = rawUrl.trim();


    if (!url) {
        return null;
    }


    /*
     * Already has protocol
     */

    if (
        url.startsWith("https://") ||
        url.startsWith("http://")
    ) {

        return url;
    }


    /*
     * HTTPS
     */

    if (httpsPrefix.checked) {

        return "https://" + url;
    }


    /*
     * HTTP
     */

    if (httpPrefix.checked) {

        return "http://" + url;
    }


    /*
     * Neither
     */

    return url;
}


/* =====================================================
   CREATE LINK BOX
===================================================== */

function createLinkBox(url, index) {

    /* ===============================
       BOX
    =============================== */

    const box =
        document.createElement("div");

    box.className =
        "link-box";


    /* ===============================
       HEADER
    =============================== */

    const header =
        document.createElement("div");

    header.className =
        "link-header";


    const title =
        document.createElement("div");

    title.className =
        "link-title";

    title.textContent =
        url;


    title.title =
        url;


    const menu =
        document.createElement("div");

    menu.className =
        "link-menu";

    menu.textContent =
        "☰";


    header.appendChild(title);

    header.appendChild(menu);


    /* ===============================
       LOADING
    =============================== */

    const loading =
        document.createElement("div");

    loading.className =
        "loading";

    loading.textContent =
        "Loading...";


    /* ===============================
       IFRAME
    =============================== */

    const iframe =
        document.createElement("iframe");

    iframe.className =
        "link-frame";

    iframe.src =
        url;

    iframe.loading =
        "eager";

    iframe.referrerPolicy =
        "no-referrer-when-downgrade";

    iframe.setAttribute(
        "allowfullscreen",
        ""
    );


    /*
     * IMPORTANT:
     *
     * No sandbox.
     *
     * No sandbox="allow-scripts".
     *
     * No sandbox at all.
     *
     * This gives the iframe the normal browser
     * permissions allowed by the target website.
     */


    /* ===============================
       FALLBACK
    =============================== */

    const fallback =
        document.createElement("div");

    fallback.className =
        "frame-fallback";


    const fallbackTitle =
        document.createElement("div");

    fallbackTitle.className =
        "frame-fallback-title";

    fallbackTitle.textContent =
        "This page cannot be displayed here";


    const fallbackText =
        document.createElement("div");

    fallbackText.className =
        "frame-fallback-text";

    fallbackText.textContent =
        "The website may block iframe embedding.";


    const newTab =
        document.createElement("a");

    newTab.className =
        "open-new-tab";

    newTab.href =
        url;

    newTab.target =
        "_blank";

    newTab.rel =
        "noopener noreferrer";

    newTab.textContent =
        "Open in New Tab";


    fallback.appendChild(
        fallbackTitle
    );

    fallback.appendChild(
        fallbackText
    );

    fallback.appendChild(
        newTab
    );


    /* ===============================
       APPEND
    =============================== */

    box.appendChild(header);

    box.appendChild(iframe);

    box.appendChild(loading);

    box.appendChild(fallback);

    linksContainer.appendChild(box);


    /* ===============================
       IFRAME LOAD
    =============================== */

    iframe.addEventListener(
        "load",
        function () {

            loading.classList.add(
                "hidden"
            );

        }
    );


    /*
     * IMPORTANT:
     *
     * We cannot reliably read the HTTP status
     * or iframe content of another domain because
     * of browser same-origin security.
     *
     * So we don't try to inspect the iframe.
     */


    /*
     * After a few seconds, remove loading.
     * If the browser shows a blocked-frame page,
     * the fallback can be used manually.
     */

    setTimeout(function () {

        loading.classList.add(
            "hidden"
        );

    }, 5000);


    return box;
}


/* =====================================================
   OPEN LINKS
===================================================== */

openBtn.addEventListener(
    "click",
    function () {

        /*
         * Remove previous boxes
         */

        linksContainer.innerHTML =
            "";


        /*
         * Get lines
         */

        const lines =
            linksInput.value
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(line => line.length > 0);


        if (lines.length === 0) {

            alert(
                "Please enter at least one link."
            );

            return;
        }


        /*
         * Create boxes
         */

        lines.forEach(
            function (rawUrl, index) {

                const url =
                    prepareUrl(rawUrl);


                if (!url) {
                    return;
                }


                createLinkBox(
                    url,
                    index
                );

            }
        );

    }
);


/* =====================================================
   CLEAR
===================================================== */

clearBtn.addEventListener(
    "click",
    function () {

        linksInput.value = "";

        linksContainer.innerHTML = "";

    }
);


/* =====================================================
   CTRL + ENTER
===================================================== */

linksInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.ctrlKey &&
            event.key === "Enter"
        ) {

            openBtn.click();
        }

    }
);

</script>


</body>
</html>
