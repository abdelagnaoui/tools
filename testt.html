<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEESSSRRRR</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:Arial,sans-serif;background:#eaf1fb;color:#172033}
main{max-width:720px;margin:auto;padding:22px;background:#fff;border-radius:12px;box-shadow:0 5px 22px #00000012}
h1{text-align:center;color:#244d87;font-size:24px;margin:0 0 18px}
textarea{display:block;width:100%;height:240px;padding:12px;border:1px solid #bdcbe0;border-radius:7px;font:14px monospace;resize:vertical}
.options{display:flex;flex-wrap:wrap;gap:14px;margin:15px 0}
button{width:100%;padding:12px;border:0;border-radius:7px;font-size:16px;cursor:pointer}
#open{background:#1674e8;color:#fff}#clear{margin-top:9px;background:#e8edf4;color:#243247}
#status{text-align:center;margin-top:12px;font-size:13px;line-height:1.5}
small{display:block;color:#5b6472;line-height:1.5;margin-top:14px}
</style>
</head>
<body>
<main>
<h1>Open Multiple Links</h1>
<textarea id="links" placeholder="Paste one link per line
https://example.com
https://example.org"></textarea>
<div class="options">
<label><input type="radio" name="prefix" value="https"> Add https://</label>
<label><input type="radio" name="prefix" value="http" checked=""> Add http://</label>
<label><input type="radio" name="prefix" value="none"> Neither</label>
</div>
<button id="open" type="button">Open Links in One Popup</button>
<button id="clear" type="button">Clear</button>
<div id="status" role="status"></div>
<small>The main page stays on GitHub Pages. The popup page is served by your Cloudflare Worker. Websites may block iframe embedding, and HTTP pages can be blocked when embedded from an HTTPS popup.</small>
</main>
<script>
(() => {
  // Replace this with your actual deployed Worker URL.
  const WORKER_URL = "https://tools.lagnaouiabderazak.workers.dev";
  const textarea = document.getElementById("links");
  const status = document.getElementById("status");

  document.getElementById("open").addEventListener("click", () => {
    let links = [...new Set(textarea.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean))];
    if (!links.length) {
      status.textContent = "Paste at least one link first.";
      return;
    }

    const prefix = document.querySelector('input[name="prefix"]:checked').value;
    links = links.map(link => {
      if (/^https?:\/\//i.test(link)) return link;
      if (prefix === "none") return link;
      return prefix + "://" + link;
    });

    for (const link of links) {
      try {
        const url = new URL(link);
        if (!["http:", "https:"].includes(url.protocol)) throw new Error();
      } catch {
        status.textContent = "Invalid URL: " + link;
        return;
      }
    }

    // Open synchronously in the click event so popup blockers are less likely to block it.
    const popup = window.open("about:blank", "OpenLinksPopup", "popup=yes,width=1400,height=900,resizable=yes,scrollbars=yes");
    if (!popup) {
      status.textContent = "Popup blocked. Allow pop-ups for this GitHub Pages website and try again.";
      return;
    }

    // Pass links in the fragment, not to a server-side proxy.
    const target = WORKER_URL.replace(/\/+$/, "") + "/popup#links=" +
      encodeURIComponent(JSON.stringify(links));
    popup.location.href = target;
    status.textContent = links.length + (links.length === 1 ? " link sent to one popup." : " links sent to one popup.");
  });

  document.getElementById("clear").addEventListener("click", () => {
    textarea.value = "";
    status.textContent = "";
  });
})();
</script>


</body></html>
