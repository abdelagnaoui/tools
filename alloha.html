	<script>
	
	
	let autoSaveTimer;

document.getElementById("input")
.addEventListener("input", () => {

  clearTimeout(autoSaveTimer);

  autoSaveTimer = setTimeout(() => {
    saveTextareaToSupabase();
  }, 5000);

});

async function saveTextareaToSupabase(){

  const text =
    document.getElementById("input").value;

  if(!text.trim()) return;

  const {
    data: { user }
  } =
  await window.supabase.auth.getUser();

  const file = new Blob(
    [text],
    {
      type:"text/plain"
    }
  );

  const fileName =
    `autosaves/${user.id}.txt`;

 try{

  const { error } =
  await window.supabase.storage
  .from("uploads")
  .upload(
    fileName,
    file,
    {
      upsert:true
    }
  );

  if(error){

    console.error(error);

    document.getElementById("status").textContent =
      "❌ Auto save failed";

    return;
  }

  document.getElementById("status").textContent =
    "💾 Auto saved";

}catch(err){

  console.error(err);

  document.getElementById("status").textContent =
    "❌ Auto save error";
}
}
async function logout(){

  await window.supabase.auth.signOut();

  window.location.href =
    "login.html";
}

	async function uploadToSupabase(file){

  try{

    const fileName =
      Date.now() + "-" + file.name;

    const { data, error } =
      await window.supabase.storage
      .from("uploads")
      .upload(fileName, file);

    if(error){

      uploadSuccess = false;

      disableActions();

      document.getElementById("status").textContent =
        "❌ Upload failed";

      return;
    }

    uploadSuccess = true;

    enableActions();

    document.getElementById("status").textContent =
      "✅ Upload success";

    console.log(data);

  }catch(err){

    uploadSuccess = false;

    disableActions();

    document.getElementById("status").textContent =
      "❌ Upload error";

    console.error(err);
  }
}


function disableActions(){

  document.querySelector(".generate").disabled = true;
  document.querySelector(".download").disabled = true;
  document.querySelector(".downloadall").disabled = true;
}

function enableActions(){

  document.querySelector(".generate").disabled = false;
  document.querySelector(".download").disabled = false;
  document.querySelector(".downloadall").disabled = false;
}



let uploadedFile = null;
let uploadSuccess = false;
let chunks = [];
let currentIndex = 0;

	const fileInput =
	document.getElementById("fileInput");
disableActions();
	fileInput.addEventListener(
	"change",
	loadFile
	);

function loadFile(event){
 

  const file =
    event.target.files[0];

  if(!file) return;

  uploadedFile = file;
  const ext =
file.name.split(".").pop().toLowerCase();

if(ext === "zip"){

  document.getElementById("input").value =
    "📦 ZIP loaded";

}
else if(ext === "rar"){

  document.getElementById("input").value =
    "📦 RAR loaded";

}
else{

  document.getElementById("input").value =
    "📄 TXT/CSV loaded";

}
document.getElementById("fileName").textContent =
  file.name;

document.getElementById("status").textContent =
  `📂 ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;

uploadToSupabase(file);
}

async function prepareFiles(){

  if(!uploadedFile){
    alert("Import file first.");
    return;
  }

  let text = "";

  // ZIP
  if(uploadedFile.name.toLowerCase().endsWith(".zip")){

    document.getElementById("status").textContent =
      "📦 Extracting ZIP...";

    const zip = await JSZip.loadAsync(uploadedFile);

    const firstFile =
      Object.keys(zip.files)[0];

    text = await zip.files[firstFile]
      .async("string");

  }

  // TXT / CSV
  else{

    text = await uploadedFile.text();

  }

  const size =
    parseInt(
      document.getElementById("chunkSize").value
    ) || 100;

  const lines =
    text.split(/\r?\n/);

  chunks = [];

  for(let i=0; i<lines.length; i+=size){

    chunks.push(
      lines.slice(i, i+size).join("\n")
    );

  }

  currentIndex = 0;

  document.getElementById("totalFiles").textContent =
    chunks.length;

  updateUI();

  document.getElementById("status").textContent =
    `✅ ${chunks.length} files ready`;
}

	function downloadNext(){
if(!uploadSuccess){

  alert("Upload failed.");
  return;
}
	if(chunks.length===0){

	alert(
	"Generate files first."
	);

	return;
	}

	if(
	currentIndex>=chunks.length
	){

	alert(
	"All files downloaded."
	);

	return;
	}

	downloadChunk(
	currentIndex
	);

	currentIndex++;

	updateUI();

	if(
	currentIndex===chunks.length
	){
	document.getElementById(
	"status"
	).textContent =
	"🎉 Finished";
	}
	}

function downloadAll(){

  if(!uploadSuccess){

    alert("Upload failed.");
    return;
  }

  if(chunks.length===0){

    alert("Generate files first.");

    return;
  }

  for(
    let i=0;
    i<chunks.length;
    i++
  ){
    setTimeout(
      ()=>{
        downloadChunk(i);
      },
      i*300
    );
  }

  currentIndex =
    chunks.length;

  updateUI();

  document.getElementById(
    "status"
  ).textContent =
    "🚀 Downloading all files";
}

	function downloadChunk(index){

	const blob =
	new Blob(
	[chunks[index]],
	{
	type:
	"text/plain"
	}
	);

	const url =
	URL.createObjectURL(
	blob
	);

	const a =
	document.createElement(
	"a"
	);

	a.href = url;

	a.download =
	`Sublist_${
	index+1
	}.txt`;

	document.body.appendChild(
	a
	);

	a.click();

	document.body.removeChild(
	a
	);

	URL.revokeObjectURL(
	url
	);
	}

	function updateUI(){

	const percent =
	chunks.length===0
	?0
	:(currentIndex/
	chunks.length)
	*100;

	document.getElementById(
	"progress"
	).style.width =
	percent + "%";

	document.getElementById(
	"status"
	).textContent =
	`Downloaded ${currentIndex} / ${chunks.length}`;
	}

	function resetAll(){

uploadSuccess = false;
uploadedFile = null;
disableActions();

	chunks = [];

	currentIndex = 0;

	document.getElementById(
	"input"
	).value = "";

	document.getElementById(
	"fileName"
	).textContent =
	"No file selected";

	document.getElementById(
	"totalFiles"
	).textContent = 0;

	document.getElementById(
	"status"
	).textContent =
	"Waiting...";

	document.getElementById(
	"progress"
	).style.width =
	"0%";

	document.getElementById(
	"chunkSize"
	).value =
	100;
	}
	</script>
