<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Dashboard</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial;
}

body{
    margin:0;
    padding:30px;
    background:#f5f5f5;
}

.container{

    max-width:1600px;

    margin:auto;

    display:grid;

    grid-template-columns:320px 1fr;

    gap:20px;

}

.left{

    display:flex;

    flex-direction:column;

    gap:20px;

}

.right{

    display:flex;

    flex-direction:column;

    gap:20px;

}

.card{

    background:white;

    padding:22px;

    border-radius:20px;

    box-shadow:0 4px 12px rgba(0,0,0,.08);

}

input,
textarea{

    width:100%;

    padding:14px;

    border:1px solid #ccc;

    border-radius:12px;

    font-size:16px;

}

textarea{
    resize:none;
}

button{

    border:none;

    cursor:pointer;

    background:black;

    color:white;

    padding:14px 25px;

    border-radius:12px;

    margin-top:15px;

}

h2{
    margin-top:0;
}

.row{

    display:grid;

    grid-template-columns:1fr 1fr auto;

    gap:15px;

}

.twoCols{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

}

.ok{

    margin-top:20px;

    padding:18px;

    border:1px solid green;

    color:green;

    border-radius:15px;

}

</style>
</head>
<body>




<div class="container">




    <!-- LEFT -->
    <div class="left">



        <!-- SERVER -->
        <div class="card">


            <h2>Server</h2>


            <input
                id="server"
                placeholder="Server Name"
            >



            <textarea
                id="domains"
                rows="6"
                placeholder="gmail.com&#10;hotmail.com"
                style="margin-top:15px;"
            ></textarea>



            <button
                id="generateDomainsBtn"
            >
                Generate Domains
            </button>


        </div>







        <!-- IP -->
        <div class="card">


            <h2>IP Address</h2>


            <textarea
                id="ip"
                rows="8"
                placeholder="One IP per line"
            ></textarea>


        </div>




    </div>








    <!-- RIGHT -->
    <div class="right">






        <!-- DOMAINS + SPF -->
        <div class="card">


            <h2>Generated Domains</h2>



            <div class="twoCols">



                <!-- domains -->
                <textarea
                    id="generatedDomains"
                    rows="8"
                    readonly
                ></textarea>




                <!-- SPF -->
                <textarea
                    id="domainSpf"
                    rows="8"
                    readonly
                ></textarea>




            </div>



        </div>








        <!-- WILDCARD + DKIM -->
        <div class="card">


            <h2>Wildcard + DKIM</h2>



            <textarea
                id="wildcardDkim"
                rows="8"
                readonly
            ></textarea>



        </div>








        <!-- DKIM -->
        <div class="card">


            <h2>DKIM Inspector</h2>



            <div class="row">



                <input
                    id="domain"
                    placeholder="example.com"
                >



                <input
                    id="selector"
                    value="default"
                >



                <button
                    id="inspectBtn"
                >
                    INSPECT DKIM
                </button>



            </div>





            <div id="status"></div>





            <h3>DKIM Record</h3>



            <textarea
                id="dkim"
                rows="8"
                readonly
            ></textarea>



        </div>




    </div>




</div>









<script>


const dkimField =
document.getElementById(
    "dkim"
);


const statusField =
document.getElementById(
    "status"
);








/* random letters */
function randomText(){


    const letters =

    "abcdefghijklmnopqrstuvwxyz";



    let result =
    "";



    for(
        let i=0;
        i<5;
        i++
    ){


        result +=

        letters[

            Math.floor(

                Math.random()

                *

                letters.length

            )

        ];


    }



    return result;


}









/* generate all */
function generateDomains(){



    const server =

    document
    .getElementById(
        "server"
    )
    .value
    .trim();




    const domains =

    document
    .getElementById(
        "domains"
    )
    .value

    .split("\n")

    .map(
        x=>x.trim()
    )

    .filter(
        x=>x
    );




    const ips =

    document
    .getElementById(
        "ip"
    )
    .value

    .split("\n")

    .map(
        x=>x.trim()
    )

    .filter(
        x=>x
    );




    const spf =

        "v=spf1 "

        +

        ips.map(

            ip=>

            "ip4:"+ip

        ).join(
            " "
        )

        +

        " -all";




    const randomGroup =
    randomText();




    const subDomains =
    [];


    const spfRecords =
    [];


    const wildcardRecords =
    [];




    const dkim =

    document
    .getElementById(
        "dkim"
    )
    .value;




    domains.forEach(

        domain => {


            const sub =

                server
                +
                "."
                +
                randomGroup
                +
                "."
                +
                domain;




            subDomains.push(
                sub
            );




            spfRecords.push(

                sub
                +
                ","
                +
                spf

            );




            wildcardRecords.push(

                "*."
                +
                sub
                +
                ","
                +
                dkim

            );


        }

    );





    document
    .getElementById(
        "generatedDomains"
    )
    .value =

    subDomains.join(
        "\n"
    );





    document
    .getElementById(
        "domainSpf"
    )
    .value =

    spfRecords.join(
        "\n"
    );





    document
    .getElementById(
        "wildcardDkim"
    )
    .value =

    wildcardRecords.join(
        "\n"
    );


}









/* DKIM */
async function inspectDKIM(){



    const domain =

    document
    .getElementById(
        "domain"
    )
    .value
    .trim();




    const selector =

    document
    .getElementById(
        "selector"
    )
    .value
    .trim();




    if(
        !domain
    ){
        return;
    }




    dkimField.value =
    "Loading...";




    try{



        const query =

            selector
            +
            "._domainkey."
            +
            domain;




        const response =

        await fetch(

            "https://dns.google/resolve?name="

            +

            query

            +

            "&type=TXT"

        );




        const data =

        await response.json();




        let dkimText =
        "Not found";




        if(

            data.Answer

            &&

            data.Answer.length

        ){



            dkimText =

            data.Answer

            .map(

                x=>

                x.data.replaceAll(
                    '\"',
                    ''
                )

            )

            .join(
                " "
            );




            statusField.innerHTML =

            `
            <div class="ok">
                Congratulations! Your DKIM record is valid.
            </div>
            `;


        }




        dkimField.value =
        dkimText;



    }
    catch(error){


        dkimField.value =
        "Error";


    }


}









document
.getElementById(
    "generateDomainsBtn"
)
.addEventListener(
    "click",
    generateDomains
);




document
.getElementById(
    "inspectBtn"
)
.addEventListener(
    "click",
    inspectDKIM
);


</script>


</body>
</html>
