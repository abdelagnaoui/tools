<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Server Dashboard</title>

<style>
*{box-sizing:border-box}
:root{
 --panel:rgba(8,21,38,.44);
 --panel-soft:rgba(255,255,255,.07);
 --border:rgba(255,255,255,.18);
 --text:#fff;--muted:#dbeafe;
 --primary1:#0ea5e9;--primary2:#6366f1;
}
html,body{min-height:100%;margin:0}
body{
 min-height:100vh;padding:22px 18px 36px;
 font-family:"Poppins","Segoe UI",Arial,sans-serif;color:var(--text);
 background:linear-gradient(rgba(4,18,35,.16),rgba(4,18,35,.34)),url("https://wallpapercave.com/wp/wp3284848.gif") center center/cover fixed no-repeat;
 transition:background .35s ease,color .25s ease;
}
body.pink-mode{
 --panel:rgba(58,12,49,.44);--panel-soft:rgba(255,205,233,.10);
 --border:rgba(255,190,225,.22);--muted:#ffe5f4;
 --primary1:#ec4899;--primary2:#a855f7;
 background:linear-gradient(rgba(60,8,45,.18),rgba(60,8,45,.34)),url("https://wallpaperaccess.com/full/12067286.gif") center center/cover fixed no-repeat;
}
.container{width:min(1400px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:20px}
.left,.right{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{
 background:var(--panel);padding:20px;border-radius:22px;
 border:1px solid var(--border);box-shadow:0 18px 45px #0005;
 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
 min-width:0;
}
textarea{
 width:100%;resize:vertical;min-width:0;padding:14px;
 border:1px solid var(--border);border-radius:13px;
 background:var(--panel-soft);color:var(--text);
 font:400 14px/1.55 "Poppins","Segoe UI",Arial,sans-serif;
 outline:none;transition:border-color .2s,box-shadow .2s;
}
textarea::placeholder{color:var(--muted);opacity:.8}
textarea:focus{border-color:var(--primary1);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary1) 22%,transparent)}
textarea[readonly]{background:rgba(0,0,0,.12)}
button{
 border:1px solid rgba(255,255,255,.18);cursor:pointer;
 background:linear-gradient(135deg,var(--primary1),var(--primary2));
 color:white;padding:12px 18px;border-radius:12px;margin-top:15px;
 font:600 14px "Poppins","Segoe UI",Arial,sans-serif;
 box-shadow:0 8px 20px color-mix(in srgb,var(--primary1) 25%,transparent);
 transition:transform .2s,filter .2s,box-shadow .2s;
}
button:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 10px 25px #0003}
button:active{transform:translateY(0)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
h2{margin:0 0 14px;color:#fff;font-size:20px;font-weight:700}
h3{color:var(--muted);font-size:15px;margin:18px 0 10px}
@media(max-width:850px){
 body{padding:16px 12px 28px}
 .container{grid-template-columns:1fr}
 .left,.right{gap:15px}
 .card{padding:16px}
}
@media(max-width:560px){
 .row{grid-template-columns:1fr}
 textarea{font-size:13px}
 h2{font-size:18px}
}
</style>
</head>
<body>





<div class="container">





    <!-- LEFT -->
    <div class="left">





        <div class="card">


            <h2>Server</h2>


            <textarea
                id="servers"
                rows="6"
                placeholder="one server per line"
            ></textarea>




            <textarea
                id="domains"
                rows="8"
                style="margin-top:15px;"
                placeholder="domains + ---"
            ></textarea>




            <button id="generateBtn">
                Generate Domains
            </button>




            <button id="exportBtn">
                Export Excel
            </button>


        </div>








        <div class="card">


            <h2>IP Address</h2>


            <textarea
                id="ips"
                rows="10"
                placeholder="ips + ---"
            ></textarea>


        </div>




    </div>









    <!-- RIGHT -->
    <div class="right">






        <div class="card">


            <h2>Generated Domains</h2>



            <div class="row">


                <textarea
                    id="generatedDomains"
                    rows="8"
                    readonly
                ></textarea>



                <textarea
                    id="spfOutput"
                    rows="8"
                    readonly
                ></textarea>


            </div>


        </div>








        <div class="card">


            <h2>Wildcard + DKIM</h2>


            <textarea
                id="wildcardOutput"
                rows="8"
                readonly
            ></textarea>


        </div>








        <div class="card">


            <h2>DKIM Inspector</h2>


            <textarea
                id="dkimInputs"
                rows="6"
                placeholder="domain.com"
            ></textarea>




            <h3>DKIM Record</h3>




            <textarea
                id="dkimOutput"
                rows="8"
                readonly
            ></textarea>


        </div>




    </div>





</div>








<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>


let generatedByServer =
[];





function randomText(){

    const letters =
    "abcdefghijklmnopqrstuvwxyz";


    let result =
    "";



    for(
        let i=0;
        i<5;
        i++
    ){

        result +=

        letters[

            Math.floor(
                Math.random()
                *
                letters.length
            )

        ];

    }


    return result;

}






function splitGroups(
    text
){

    return text

    .split(
        "---"
    )

    .map(
        x=>x.trim()
    )

    .filter(
        x=>x
    );

}








async function fetchDKIM(
    domain,
    selector
){

    try{


        const query =

            selector
            +
            "._domainkey."
            +
            domain;




        const response =

        await fetch(

            "https://dns.google/resolve?name="

            +

            query

            +

            "&type=TXT"

        );




        const data =

        await response.json();




        if(
            data.Answer
        ){

            return data.Answer

            .map(

                x=>

                x.data.replaceAll(
                    '\"',
                    ''
                )

            )

            .join(
                " "
            );

        }


    }
    catch(e){}



    return "Not found";

}








async function generateAll(){



    generatedByServer =
    [];




    const servers =

    document
    .getElementById(
        "servers"
    )
    .value

    .split("\n")

    .map(
        x=>x.trim()
    )

    .filter(
        x=>x
    );





    const domainGroups =

    splitGroups(

        document
        .getElementById(
            "domains"
        )
        .value

    );





    const ipGroups =

    splitGroups(

        document
        .getElementById(
            "ips"
        )
        .value

    );





    const dkimLines =

    document
    .getElementById(
        "dkimInputs"
    )
    .value

    .split("\n")

    .map(
        x=>x.trim()
    )

    .filter(
        x=>x
    );






    const domainResults =
    [];


    const spfResults =
    [];


    const wildcardResults =
    [];


    const dkimResults =
    [];






    for(

        let i=0;

        i<servers.length;

        i++

    ){



        const server =
        servers[i];




        const domains =

        domainGroups[i]

        .split("\n")

        .map(
            x=>x.trim()
        )

        .filter(
            x=>x
        );




        const ips =

        ipGroups[i]

        .split("\n")

        .map(
            x=>x.trim()
        )

        .filter(
            x=>x
        );





        const line =
        dkimLines[i];



        let dkimDomain =
        line;



        let selector =
        "default";



        if(
            line.includes("|")
        ){

            const parts =
            line.split("|");


            dkimDomain =
            parts[0].trim();


            selector =
            parts[1].trim();

        }




        const dkim =

        await fetchDKIM(

            dkimDomain,

            selector

        );




        dkimResults.push(
            dkim
        );




        const random =
        randomText();




        const spf =

            "v=spf1 "

            +

            ips.map(

                ip=>

                "ip4:"+ip

            ).join(
                " "
            )

            +

            " -all";




        const serverGenerated =
        [];




        domains.forEach(

            domain => {


                const sub =

                    server
                    +
                    "."
                    +
                    random
                    +
                    "."
                    +
                    domain;




                serverGenerated.push(
                    sub
                );




                domainResults.push(
                    sub
                );




                spfResults.push(

                    sub
                    +
                    ","
                    +
                    spf

                );




                wildcardResults.push(

                    "*."
                    +
                    sub
                    +
                    ","
                    +
                    dkim

                );


            }

        );




        generatedByServer.push({

            name: server,

            domains:
            serverGenerated

        });



    }






    document
    .getElementById(
        "generatedDomains"
    )
    .value =

    domainResults.join(
        "\n"
    );






    document
    .getElementById(
        "spfOutput"
    )
    .value =

    spfResults.join(
        "\n"
    );






    document
    .getElementById(
        "wildcardOutput"
    )
    .value =

    wildcardResults.join(
        "\n"
    );






    document
    .getElementById(
        "dkimOutput"
    )
    .value =

    dkimResults.join(
        "\n\n"
    );


}








function exportExcel(){



    if(
        generatedByServer.length===0
    ){
        return;
    }




    const workbook =

    XLSX.utils.book_new();




    let maxRows =
    0;




    generatedByServer.forEach(

        serverData => {


            if(

                serverData.domains.length

                >

                maxRows

            ){

                maxRows =

                serverData.domains.length;

            }


        }

    );





    const rows =
    [];





    rows.push(

        generatedByServer.map(

            serverData =>

            serverData.name

        )

    );






    for(

        let i=0;

        i<maxRows;

        i++

    ){



        const row =

        generatedByServer.map(

            serverData =>


            serverData.domains[i]

            ||

            ""

        );




        rows.push(
            row
        );


    }






    const sheet =

    XLSX.utils.aoa_to_sheet(
        rows
    );





    XLSX.utils.book_append_sheet(

        workbook,

        sheet,

        "Servers"

    );





    XLSX.writeFile(

        workbook,

        "servers.xlsx"

    );


}








document
.getElementById(
    "generateBtn"
)
.addEventListener(
    "click",
    generateAll
);




document
.getElementById(
    "exportBtn"
)
.addEventListener(
    "click",
    exportExcel
);


</script>

</body>
</html>
