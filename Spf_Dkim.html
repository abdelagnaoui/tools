<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Server Dashboard</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial;
}

body{
    margin:0;
    padding:30px;
    background:#f5f5f5;
}

.container{
    max-width:1600px;
    margin:auto;

    display:grid;
    grid-template-columns:260px 1fr;

    gap:20px;
}

.left,
.right{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.card{
    background:white;

    padding:18px;

    border-radius:20px;

    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

input,
textarea{
    width:100%;

    padding:14px;

    border:1px solid #ccc;

    border-radius:12px;

    font-size:14px;
}

textarea{
    resize:none;
}

button{
    border:none;

    cursor:pointer;

    background:black;

    color:white;

    padding:12px 20px;

    border-radius:12px;

    margin-top:15px;
}

.row{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;
}

h2{
    margin-top:0;
}
</style>

</head>
<body>





<div class="container">





    <!-- LEFT -->
    <div class="left">





        <div class="card">

            <h2>Server</h2>

            <textarea
                id="servers"
                rows="6"
                placeholder="one server per line"
            ></textarea>


            <textarea
                id="domains"
                rows="8"
                style="margin-top:15px;"
                placeholder="domains + ---"
            ></textarea>


            <button id="generateBtn">
                Generate Domains
            </button>

        </div>







        <div class="card">

            <h2>IP Address</h2>

            <textarea
                id="ips"
                rows="10"
                placeholder="ips + ---"
            ></textarea>

        </div>




    </div>









    <!-- RIGHT -->
    <div class="right">






        <!-- domains -->
        <div class="card">

            <h2>Generated Domains</h2>

            <div class="row">

                <textarea
                    id="generatedDomains"
                    rows="8"
                    readonly
                ></textarea>


                <textarea
                    id="spfOutput"
                    rows="8"
                    readonly
                ></textarea>

            </div>

        </div>








        <!-- wildcard -->
        <div class="card">

            <h2>Wildcard + DKIM</h2>

            <textarea
                id="wildcardOutput"
                rows="8"
                readonly
            ></textarea>

        </div>








        <!-- DKIM -->
        <div class="card">

            <h2>DKIM Inspector</h2>

            <textarea
                id="dkimInputs"
                rows="6"
                placeholder="domain.com|default"
            ></textarea>


            <h3>DKIM Record</h3>

            <textarea
                id="dkimOutput"
                rows="8"
                readonly
            ></textarea>

        </div>




    </div>





</div>










<script>




function randomText(){

    const letters =
    "abcdefghijklmnopqrstuvwxyz";


    let result =
    "";


    for(
        let i=0;
        i<5;
        i++
    ){

        result +=

        letters[

            Math.floor(
                Math.random()
                *
                letters.length
            )

        ];

    }


    return result;

}






function splitGroups(
    text
){

    return text

    .split(
        "---"
    )

    .map(
        x=>x.trim()
    )

    .filter(
        x=>x
    );

}








async function fetchDKIM(
    domain,
    selector
){

    try{


        const query =

            selector
            +
            "._domainkey."
            +
            domain;




        const response =

        await fetch(

            "https://dns.google/resolve?name="

            +

            query

            +

            "&type=TXT"

        );




        const data =

        await response.json();




        if(
            data.Answer
        ){

            return data.Answer

            .map(

                x=>

                x.data.replaceAll(
                    '\"',
                    ''
                )

            )

            .join(
                " "
            );

        }


    }
    catch(e){}


    return "Not found";

}








async function generateAll(){



    const servers =

    document
    .getElementById(
        "servers"
    )
    .value

    .split("\n")

    .map(
        x=>x.trim()
    )

    .filter(
        x=>x
    );





    const domainGroups =

    splitGroups(

        document
        .getElementById(
            "domains"
        )
        .value

    );





    const ipGroups =

    splitGroups(

        document
        .getElementById(
            "ips"
        )
        .value

    );





    const dkimLines =

    document
    .getElementById(
        "dkimInputs"
    )
    .value

    .split("\n")

    .map(
        x=>x.trim()
    )

    .filter(
        x=>x
    );






    const domainResults =
    [];


    const spfResults =
    [];


    const wildcardResults =
    [];


    const dkimResults =
    [];






    for(

        let i=0;

        i<servers.length;

        i++

    ){



        const server =
        servers[i];




        const domains =

        domainGroups[i]

        .split("\n")

        .map(
            x=>x.trim()
        )

        .filter(
            x=>x
        );




        const ips =

        ipGroups[i]

        .split("\n")

        .map(
            x=>x.trim()
        )

        .filter(
            x=>x
        );




        const dkimParts =

        dkimLines[i]
        .split("|");




        const dkimDomain =
        dkimParts[0];




        const selector =
        dkimParts[1]
        ||
        "default";




        const dkim =

        await fetchDKIM(

            dkimDomain,

            selector

        );




        dkimResults.push(
            dkim
        );




        const random =
        randomText();




        const spf =

            "v=spf1 "

            +

            ips.map(

                ip=>

                "ip4:"+ip

            ).join(
                " "
            )

            +

            " -all";






        domains.forEach(

            domain => {


                const sub =

                    server
                    +
                    "."
                    +
                    random
                    +
                    "."
                    +
                    domain;




                domainResults.push(
                    sub
                );




                spfResults.push(

                    sub
                    +
                    ","
                    +
                    spf

                );




                wildcardResults.push(

                    "*."
                    +
                    sub
                    +
                    ","
                    +
                    dkim

                );


            }

        );



    }







    document
    .getElementById(
        "generatedDomains"
    )
    .value =

    domainResults.join(
        "\n"
    );






    document
    .getElementById(
        "spfOutput"
    )
    .value =

    spfResults.join(
        "\n"
    );






    document
    .getElementById(
        "wildcardOutput"
    )
    .value =

    wildcardResults.join(
        "\n"
    );






    document
    .getElementById(
        "dkimOutput"
    )
    .value =

    dkimResults.join(
        "\n\n"
    );


}








document
.getElementById(
    "generateBtn"
)
.addEventListener(
    "click",
    generateAll
);


</script>

</body>
</html>
