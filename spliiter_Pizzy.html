</script>

	<style>
	*{
		margin:0;
		padding:0;
		box-sizing:border-box;
	}

	body{
		font-family:Inter,Segoe UI,sans-serif;
		background:#0f172a;
		color:white;
		min-height:100vh;
		padding:30px;
	}

	.container{
		max-width:1000px;
		margin:auto;
	}

	h1{
		text-align:center;
		margin-bottom:25px;
		font-size:2.4rem;
	}

	.card{
		background:#1e293b;
		border-radius:20px;
		padding:25px;
		box-shadow:0 10px 35px rgba(0,0,0,.3);
	}

	.import-box{

		border-radius:15px;

	}

	.import-box:hover{

	}

	.import-box.dragover{
		background:#1d4ed8;
	}

	textarea{
		width:100%;
		height:300px;
		resize:vertical;
		border:none;
		outline:none;
		border-radius:15px;
		background:#0f172a;
		color:white;
		padding:15px;
		font-size:14px;
	}

	.controls{
		display:flex;
		flex-wrap:wrap;
		gap:15px;
		margin-top:20px;
	}

	input[type="number"]{
		width:180px;
		padding:12px;
		border:none;
		border-radius:12px;
		background:#0f172a;
		color:white;

	}

	button{
		border:none;
		cursor:pointer;

		padding:12px 20px;

	button:hover{
		transform:translateY(-2px);
	}

		background:#3b82f6;
		color:white;
	}

		color:white;
	}

		color:white;
	}

		color:white;
	}

	.stats{
		margin-top:25px;
		background:#0f172a;

	}

	.stat{

		height:18px;
		background:#1e293b;

		margin-top:15px;

		font-size:28px;
		font-weight:bold;

	}

	</head>
	<body>

	<div class="container">

	<h3>📁 Hello,</h3>
<div style="text-align:right;margin-bottom:10px;">
  <img
    src="https://i.imgur.com/pj7yIrF.png"
    alt="Logout"
    onclick="logout()"
    title="Logout"
    style="
      width:28px;
      height:28px;
      cursor:pointer;
      transition:.2s;
    "
    onmouseover="this.style.transform='scale(1.1)'"
    onmouseout="this.style.transform='scale(1)'"
  >
</div>
	<div class="card">

	<input
	type="file"
	id="fileInput"
	accept=".txt,.csv"
	style="display:none"
	>

	<div
	class="import-box"
	id="dropZone"
	onclick="document.getElementById('fileInput').click()"
	>
	<h2>📂 Import TXT / CSV File</h2>
	<p>Click or Drag & Drop File Here</p>
	<div class="file-info" id="fileName">
	No file selected
	</div>
	</div>

	<textarea
	id="input"
	placeholder="Or paste your content here..."
	></textarea>

	<div class="controls">

	<input
	type="number"
	id="chunkSize"
	value="100"
	min="1"
	placeholder="Lines per file"
	>

<button id="generateBtn" class="generate" onclick="prepareFiles()">
⚡ Generate Files
</button>

<button id="downloadBtn" class="download" onclick="downloadNext()">
⬇ Download Next
</button>

<button id="downloadAllBtn" class="downloadall" onclick="downloadAll()">
🚀 Download All
</button>
	<button
	class="reset"
	onclick="resetAll()"
	>
	🗑 Reset
	</button>

	</div>

	<div class="stats">

	<div class="stat">
	Files Generated:
	<span class="big" id="totalFiles">0</span>
	</div>

	<div class="stat" id="status">
	Waiting...
	</div>

	<div class="progress-container">
	<div class="progress" id="progress"></div>
	</div>

	</div>

	</div>

	</div>

 

	<script>
let uploadedFile = null;
let uploadSuccess = false;
let chunks = [];
let currentIndex = 0;


function disableActions(){

  document.getElementById("generateBtn").disabled = true;
  document.getElementById("downloadBtn").disabled = true;
  document.getElementById("downloadAllBtn").disabled = true;
}

function enableActions(){

  document.getElementById("generateBtn").disabled = false;
  document.getElementById("downloadBtn").disabled = false;
  document.getElementById("downloadAllBtn").disabled = false;
}

 

async function uploadToSupabase(file){

  try{

    document.getElementById("status").textContent =
      "...";

    const fileName =
      Date.now() + "-" + file.name;

    const { data, error } =
      await window.supabase.storage
      .from("uploads")
      .upload(fileName, file);

    if(error){

      uploadSuccess = false;

      document.getElementById("status").textContent =
        "❌ Upload failed";

      disableActions();

      return;
    }

    uploadSuccess = true;

    document.getElementById("status").textContent =
      "✅ Upload success";

    enableActions();

    console.log(data);

  }catch(err){

    uploadSuccess = false;

    disableActions();

    console.error(err);

    document.getElementById("status").textContent =
      "❌ Upload error";
  }
}



 
	const fileInput =
	document.getElementById("fileInput");

	disableActions();

fileInput.addEventListener(
  "change",
  loadFile
);

function loadFile(event){

  const file = event.target.files[0];

  if(!file) return;

  uploadedFile = file;

  document.getElementById("fileName").textContent =
    file.name;

  document.getElementById("status").textContent =
    `📂 ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;

  uploadToSupabase(file);

  document.getElementById("input").value =
    "Large file loaded. Click Generate Files.";
}

	const dropZone =
	document.getElementById(
	"dropZone"
	);

	dropZone.addEventListener(
	"dragover",
	e=>{
	e.preventDefault();
	dropZone.classList.add(
	"dragover"
	);
	}
	);

	dropZone.addEventListener(
	"dragleave",
	()=>{
	dropZone.classList.remove(
	"dragover"
	);
	}
	);

	dropZone.addEventListener(
	"drop",
	e=>{
	e.preventDefault();

	dropZone.classList.remove(
	"dragover"
	);

	const file =
	e.dataTransfer.files[0];

	if(!file) return;

	fileInput.files =
	e.dataTransfer.files;

	loadFile({
	target:{
	files:[file]
	}
	});
	}
	);

	  
async function prepareFiles(){


if(!uploadSuccess){

  alert("Upload failed.");

  return;
}

  if(!uploadedFile){

    alert("Import file first.");

    return;
  }

  document.getElementById("status").textContent =
    "Reading file...";

  const text =
    await uploadedFile.text();

  const size =
    parseInt(
      document.getElementById(
        "chunkSize"
      ).value
    ) || 100;

  const lines =
    text.split(/\r?\n/);

  chunks = [];

  for(
    let i = 0;
    i < lines.length;
    i += size
  ){

    chunks.push(
      lines
      .slice(i, i + size)
      .join("\n")
    );

  }

  currentIndex = 0;

  document.getElementById(
    "totalFiles"
  ).textContent =
  chunks.length;

  updateUI();

  document.getElementById(
    "status"
  ).textContent =
  `✅ ${chunks.length} files ready`;
}
	function downloadNext(){

if(!uploadSuccess){
  alert("Upload failed.");
  return;
}

	if(chunks.length===0){

	alert(
	"Generate files first."
	);

	return;
	}

	if(
	currentIndex>=chunks.length
	){

	alert(
	"All files downloaded."
	);

	return;
	}

	downloadChunk(
	currentIndex
	);

	currentIndex++;

	updateUI();

	if(
	currentIndex===chunks.length
	){
	document.getElementById(
	"status"
	).textContent =
	"🎉 Finished";
	}
	}

	function downloadAll(){

if(!uploadSuccess){
  alert("Upload failed.");
  return;
}

	if(chunks.length===0){

	alert(
	"Generate files first."
	);

	return;
	}

	for(
	let i=0;
	i<chunks.length;
	i++
	){
	setTimeout(
	()=>{
	downloadChunk(i);
	},
	i*300
	);
	}

	currentIndex =
	chunks.length;

	updateUI();

	document.getElementById(
	"status"
	).textContent =
	"🚀 Downloading all files";
	}

	function downloadChunk(index){

	const blob =
	new Blob(
	[chunks[index]],
	{
	type:
	"text/plain"
	}
	);

	const url =
	URL.createObjectURL(
	blob
	);

	const a =
	document.createElement(
	"a"
	);

	a.href = url;

	a.download =
	`Sublist_${
	index+1
	}.txt`;

	document.body.appendChild(
	a
	);

	a.click();

	document.body.removeChild(
	a
	);

	URL.revokeObjectURL(
	url
	);
	}

	function updateUI(){

	const percent =
	chunks.length===0
	?0
	:(currentIndex/
	chunks.length)
	*100;

	document.getElementById(
	"progress"
	).style.width =
	percent + "%";

	document.getElementById(
	"status"
	).textContent =
	`Downloaded ${currentIndex} / ${chunks.length}`;
	}

	function resetAll(){
	
	
	
	uploadSuccess = false;
disableActions();
uploadedFile = null;
 
	chunks = [];

	currentIndex = 0;

	document.getElementById(
	"input"
	).value = "";

	document.getElementById(
	"fileName"
	).textContent =
	"No file selected";

	document.getElementById(
	"totalFiles"
	).textContent = 0;

	document.getElementById(
	"status"
	).textContent =
	"Waiting...";

	document.getElementById(
	"progress"
	).style.width =
	"0%";

	document.getElementById(
	"chunkSize"
	).value =
	100;
	}
	

	</script>

	</body>
	</html>
